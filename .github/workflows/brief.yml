name: Daily Market Brief

on:
  schedule:
    # GitHub cron is UTC. Two entries so 6:30 AM ET is hit year-round; the gate
    # job below drops whichever one isn't 6 AM in New York today.
    - cron: '30 10 * * 1-5'   # 6:30 ET while EDT
    - cron: '30 11 * * 1-5'   # 6:30 ET while EST
  workflow_dispatch:           # lets you run it by hand any time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false  (New York hour is $HOUR, not 06)" >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch market data
        run: python3 fetch_data.py market_data.json

      - name: Build headline
        run: python3 build_headline.py

      - name: Render page
        run: |
          mkdir -p public
          python3 render.py market_data.json public/index.html commentary.json

      - name: Commit refreshed data
        run: |
          git config user.name  "market-brief bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json commentary.json
          git diff --staged --quiet || git commit -m "data: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
